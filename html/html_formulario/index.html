<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Cadastro de aluno</h1>
    <p>Preencha as Informações</p>
    <form action="">
        <label for="">Nome:</label>
        <input type="name">
        <br> <br>
        <label for="">Email:</label>
        <input type="email">
        <br><br>
        <label for="">Idade:</label>
        <input type="number">
        <br><br>
        <label for="">Data de nascimento:</label>
        <input type="date">
        <br><br>
        <label for="">Senha:</label>
        <input type="password">
        <br><br>
        <button>Entrar</button>
        <br> <br> <hr><br>
        <label for="">Escolha o curso</label>
        <br>
        <input type="checkbox" name="linguagem" value="a"> Desenvolvimento de Web
        <br>
        <input type="checkbox" name="linguagem" value="b"> Design UI/UX
        <br>
        <input type="checkbox" name="linguagem" value="c"> Data Science
        <br><br>
        <label for="">Escolha a opção</label>
        <br>
        <input type="radio" name="linguagem" value="a"> <label for="">Manhã</label>
        <br>
        <input type="radio" name="linguagem" value="b"> <label for="">Tarde</label>
        <br>
        <input type="radio" name="linguagem" value="c"> <label for="">Noite</label>
        <br><br>
        <button>Confirmar</button>
    </form>
</body>
</html>
