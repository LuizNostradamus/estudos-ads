<main class="flex-grow-1 p-4" style="min-height: 100vh;">
    
    <h2 class="mb-4" style="color: #143f8f; font-weight: 500; font-weight: bold; font-style: italic;">NOVO EQUIPAMENTO</h2>

    <div class="p-4 rounded shadow-sm" style="background-color: rgba(236, 80, 8, 0.897);">
        <form>
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label text-muted small mb-1 fw-semibold">Patrimônio</label>
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted small mb-1 fw-semibold">Tipo</label>
                    <input type="text" class="form-control" value="Notebook">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted small mb-1 fw-semibold">Marca</label>
                    <input type="text" class="form-control">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label text-muted small mb-1 fw-semibold">Modelo</label>
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-muted small mb-1 fw-semibold">Número Série</label>
                    <input type="text" class="form-control">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-muted small mb-1 fw-semibold">Observação</label>
                <textarea class="form-control" rows="4"></textarea>
            </div>

            <!-- Botões alinhados à esquerda como no protótipo -->
            <div class="d-flex gap-2">
                <button type="submit" class="btn px-4 fw-semibold" style="background-color: #143f8f; color: #ffffff;">Salvar</button>
                <a href="equipamentos.html" class="btn btn-secondary px-4 fw-semibold">Cancelar</a>
            </div>
        </form>
    </div>
