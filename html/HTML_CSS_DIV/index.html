<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .titulo{
            background-color: aquamarine;
            padding: 10px;
            margin: 10px;
            text-align: center;
        }
        .titulo2{
            background-color: brown;
            padding: 10px;
            margin: 10px;
            text-align: center;
        }
        .cx2{
            font-size: 25px;
            color: rgb(255, 255, 255);
        }
        .cx1{
            font-size: 25px;
            color: rgb(10, 5, 53);
        }
    </style>
</head>
<body>
    <div class="titulo">
        <h1>Passado</h1>
        <p class="cx1">
            "O passado é um livro que não pode ser reescrito, mas cujas páginas ainda podem ser compreendidas."
        </p>
    </div>
    <div class="titulo2">
        <h1>Futuro</h1>
        <p class="cx2">
            "Entre o que sonhamos e o que será, existe o caminho que escolhemos percorrer."
        </p>
    </div>
</body>
</html>
